<form>
    <input type="text" [(ngModel)]="task" name="name" value="" placeholder="Enter the Task"/>
    <button type="button"  (click)="addTask()">Add</button>
</form>

@for(task of taskList; track task.id) 
{
    <ul class="task-list">
        <li>{{task.id}}</li>
        <li>{{task.task}}</li>
        <li><button (click)="deleteTask(task.id)">Delete</button></li>
    </ul>
}

<ul *ngFor="let list of student" >
    <li>{{list}}</li>

</ul>
<h2>Task Name: {{ name() }}</h2>
